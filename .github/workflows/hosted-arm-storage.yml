name: Native MSBuild shared CL-server paired qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msbuild-clserver-paired-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows Arm MSVC MSBuild original versus shared CL-server
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure pinned workload and observed native tools
        shell: pwsh
        env:
          HOSTING: ${{ runner.environment }}
        run: |
          try {
            .\tests\test_native_generator_selection.ps1
            .\tests\test_generator_failure_cleanup.ps1
            python .\tests\test_generator_smoke_evidence.py
            if ($LASTEXITCODE) { throw 'Smoke failure-evidence tests failed.' }
            python -m unittest discover -s tests -p 'test_msbuild_clserver*.py'
            if ($LASTEXITCODE) { throw 'MSBuild CL-server guards failed.' }
            .\tests\test_owned_build.ps1
            .\ci\Prepare-QualifiedGeneratorWorkload.ps1 -MSBuildOnly
          } catch {
            New-Item -ItemType Directory -Force evidence | Out-Null
            $_ | Out-String | Set-Content evidence\preparation-failure.log
            throw
          }
      - name: Run same-VM balanced original/server pair
        shell: pwsh
        run: |
          try {
            .\ci\Run-MSBuildClServerStudy.ps1 -ResultsDir "$env:GITHUB_WORKSPACE\evidence\builds"
          } catch {
            $_ | Out-String | Set-Content evidence\study-failure.log
            throw
          }
      - name: Retain text evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-msbuild-clserver-text
          path: |
            evidence/**/*.json
            evidence/**/*.log
            evidence/**/*.txt
            evidence/**/*.csv
            evidence/**/*.hpp
            evidence/**/*.h
            evidence/**/*.cmake
          if-no-files-found: error
  macos:
    name: macOS Arm unchanged-source matched-definition Make reference
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test source preparation guards
        shell: bash
        run: |
          mkdir -p evidence
          python3 -m unittest discover -s tests -p 'test_msbuild_clserver*.py' > evidence/preflight.log 2>&1
      - name: Run unchanged source with one excluded warmup
        shell: bash
        run: bash ci/run-macos-dls-source.sh unchanged-reference
      - name: Retain text evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-msbuild-reference-text
          path: |
            evidence/**/*.json
            evidence/**/*.log
            evidence/**/*.txt
            evidence/**/*.csv
            evidence/**/*.hpp
            evidence/**/*.h
            evidence/**/*.cmake
          if-no-files-found: error
